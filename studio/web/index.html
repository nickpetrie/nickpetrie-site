<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Studio</title>
<link rel="icon" href="assets/logo/np-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<!-- Draws a new version of a post in the browser, from the same template Claude renders with.
     Pinned to an exact version and checked against its hash. -->
<script src="https://cdn.jsdelivr.net/npm/modern-screenshot@4.6.0/dist/index.js" integrity="sha384-gGN1lMNOLP39es/9RsdeQtXj8dH/UyIcMRtuOf14OHZjXYzt7gsYXVcJ5enPlRbz" crossorigin="anonymous" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<div id="app">
  <header class="top" id="top">
    <div class="brand">
      <h1>Studio</h1>
      <p id="sub" aria-live="polite">Loading your posts…</p>
    </div>
    <div id="buffer" class="buffer"></div>
  </header>
  <nav id="tabs" class="tabs" aria-label="Sections"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<noscript><p style="padding:24px">Studio needs JavaScript. Please turn it on and reload.</p></noscript>
</body>
</html>
