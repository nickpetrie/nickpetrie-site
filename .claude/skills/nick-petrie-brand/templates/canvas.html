<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Nick Petrie social canvas</title>
<!--
  One template for every social design. render(spec, root) draws a design into root;
  window.render() draws window.SPEC into the page. Sizes are in units of a 1080px-wide
  canvas (--u), so every format scales from the same numbers. See references/formats.md.
  Studio copies this file and ../assets/ to draw designs live in the browser.
-->
<style>
@font-face { font-family: 'Source Sans 3'; src: url(../assets/fonts/SourceSans3-Regular.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: 'Source Sans 3'; src: url(../assets/fonts/SourceSans3-Semibold.woff2) format('woff2'); font-weight: 600; }
@font-face { font-family: 'Source Sans 3'; src: url(../assets/fonts/SourceSans3-Bold.woff2) format('woff2'); font-weight: 700; }
@font-face { font-family: 'Source Serif 4'; src: url(../assets/fonts/SourceSerif4-Regular.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: 'Source Serif 4'; src: url(../assets/fonts/SourceSerif4-Italic.woff2) format('woff2'); font-weight: 400; font-style: italic; }
@font-face { font-family: 'Source Serif 4'; src: url(../assets/fonts/SourceSerif4-Semibold.woff2) format('woff2'); font-weight: 600; }
@font-face { font-family: 'Source Serif 4 Display'; src: url(../assets/fonts/SourceSerif4Display-Regular.woff2) format('woff2'); font-weight: 400; }

:root { --w: 1080px; --h: 1350px; --u: 1px; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #888; }
.canvas {
  width: var(--w); height: var(--h); position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  padding: calc(80 * var(--u)) calc(84 * var(--u)) calc(64 * var(--u));
  background: var(--bg); color: var(--fg);
  font-family: 'Source Sans 3', Arial, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  break-after: page;
}
.canvas.paper  { --bg: #F7F6F1; --fg: #1F2834; --muted: #5A6470; --accent: #E6C635; --rule: #D8DCD9; --mark: #1F2834; }
.canvas.ink    { --bg: #1F2834; --fg: #F7F6F1; --muted: #A9B1BA; --accent: #E6C635; --rule: #36404C; --mark: #F7F6F1; }
.canvas.yellow { --bg: #E6C635; --fg: #1F2834; --muted: #3B4553; --accent: #1F2834; --rule: rgba(31,40,52,.35); --mark: #1F2834; }

.top { display: flex; align-items: center; justify-content: space-between; gap: calc(24 * var(--u)); }
.brand { display: flex; align-items: center; gap: calc(18 * var(--u)); font-weight: 600; font-size: calc(34 * var(--u)); }
.brand svg { width: calc(72 * var(--u)); height: auto; fill: var(--mark); }
.brand svg path { fill: var(--mark); }
.masthead svg { display: block; width: calc(var(--mast, 470) * var(--u)); height: auto; }
.masthead svg path { fill: var(--fg); }
.count { font-weight: 700; font-size: calc(26 * var(--u)); letter-spacing: .06em; color: var(--muted); }

.main { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; margin: calc(40 * var(--u)) 0 calc(44 * var(--u)); }
.main.bottom { justify-content: flex-end; }
.rules { display: grid; gap: calc(10 * var(--u)); margin-bottom: calc(36 * var(--u)); }
.rules i { display: block; width: calc(104 * var(--u)); background: var(--accent); }
.rules i:first-child { height: calc(22 * var(--u)); }
.rules i:last-child { height: calc(10 * var(--u)); }
.kicker { font-weight: 700; font-size: calc(28 * var(--u)); letter-spacing: .07em; text-transform: uppercase; margin: 0 0 calc(26 * var(--u)); }
.canvas.ink .kicker { color: var(--accent); }
.headline {
  font-family: 'Source Serif 4 Display', Georgia, serif; font-weight: 400;
  font-size: calc(var(--hs) * var(--u)); line-height: 1.06; letter-spacing: -.012em;
  margin: 0; text-wrap: balance; white-space: pre-line;
}
.headline mark { color: inherit; background: linear-gradient(transparent 58%, var(--accent) 58%, var(--accent) 84%, transparent 84%); padding: 0 .06em; margin: 0 -.06em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.canvas.ink .headline mark { background: none; color: var(--accent); }
.canvas.yellow .headline mark { background: none; text-decoration: underline; text-decoration-thickness: .07em; text-underline-offset: .12em; }
.text { font-family: 'Source Serif 4', Georgia, serif; font-size: calc(var(--ts, 40) * var(--u)); line-height: 1.4; margin: calc(var(--gap, 34) * var(--u)) 0 0; color: var(--muted); max-width: calc(860 * var(--u)); white-space: pre-line; }
.canvas.yellow .text { color: var(--fg); }

.facts { list-style: none; margin: calc(var(--gap, 34) * var(--u)) 0 0; padding: 0; display: grid; gap: calc(22 * var(--u)); }
.facts li { border-top: calc(5 * var(--u)) solid var(--accent); padding-top: calc(14 * var(--u)); font-size: calc(32 * var(--u)); line-height: 1.35; color: var(--muted); }
.facts b { display: block; color: var(--fg); font-size: calc(34 * var(--u)); margin-bottom: calc(4 * var(--u)); }

.quote-mark { font-family: 'Source Serif 4 Display', Georgia, serif; font-size: calc(300 * var(--u)); line-height: .8; height: calc(150 * var(--u)); color: var(--accent); margin-left: calc(-12 * var(--u)); }
.quote { font-family: 'Source Serif 4 Display', Georgia, serif; font-size: calc(var(--hs) * var(--u)); line-height: 1.18; margin: 0; text-wrap: pretty; white-space: pre-line; }
.byline { margin-top: calc(40 * var(--u)); font-weight: 700; font-size: calc(32 * var(--u)); display: flex; align-items: center; gap: calc(18 * var(--u)); }
.byline::before { content: ""; width: calc(40 * var(--u)); height: calc(4 * var(--u)); background: var(--fg); }
.byline span { font-weight: 400; color: var(--muted); }

.number { font-family: 'Source Serif 4 Display', Georgia, serif; font-size: calc(220 * var(--u)); line-height: .9; color: var(--accent); margin: 0 0 calc(24 * var(--u)); }
.canvas.paper .number { color: var(--fg); -webkit-text-stroke: 0; }

.foot { display: flex; justify-content: space-between; align-items: center; gap: calc(24 * var(--u)); border-top: calc(2 * var(--u)) solid var(--rule); padding-top: calc(26 * var(--u)); font-size: calc(30 * var(--u)); }
.foot .url { font-weight: 700; }
.foot .who { color: var(--muted); }
.cta { display: inline-block; margin-top: calc(44 * var(--u)); padding: calc(24 * var(--u)) calc(36 * var(--u)); font-weight: 700; font-size: calc(34 * var(--u)); background: var(--fg); color: var(--bg); border-radius: calc(6 * var(--u)); align-self: flex-start; }
.canvas.ink .cta { background: #F7F6F1; color: #1F2834; }
.canvas.f-landscape { padding: calc(52 * var(--u)) calc(64 * var(--u)) calc(40 * var(--u)); }
.f-landscape .rules { margin-bottom: calc(20 * var(--u)); }
.f-landscape .kicker { margin-bottom: calc(14 * var(--u)); }
.f-landscape .foot { padding-top: calc(16 * var(--u)); }
.f-story { padding-top: calc(230 * var(--u)); padding-bottom: calc(300 * var(--u)); }
.portrait { width: calc(150 * var(--u)); height: calc(150 * var(--u)); border-radius: 50%; object-fit: cover; margin-bottom: calc(34 * var(--u)); }
</style>
</head>
<body>
<div id="root"></div>

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// [[words]] in a headline get the highlighter.
const rich = (s) => esc(s).replace(/\[\[(.+?)\]\]/g, '<mark>$1</mark>');

const DEFAULTS = {
  statement: { theme: 'paper', hs: 96 },
  issue: { theme: 'yellow', hs: 92 },
  quote: { theme: 'ink', hs: 64 },
  point: { theme: 'paper', hs: 80 },
  offer: { theme: 'ink', hs: 84 },
  cta: { theme: 'yellow', hs: 96 },
};

async function draw(spec, root) {
  const layout = spec.layout || 'statement';
  const d = DEFAULTS[layout] || DEFAULTS.statement;
  const theme = layout === 'issue' ? 'yellow' : (spec.theme || d.theme);
  const el = document.createElement('section');
  el.className = `canvas ${theme} l-${layout} f-${spec.format || 'post'}`;
  el.style.setProperty('--hs', spec.headlineSize || (spec.format === 'landscape' ? Math.round(d.hs * 0.8) : d.hs));
  if (spec.textSize) el.style.setProperty('--ts', spec.textSize);
  const foot = `<div class="foot"><span class="who">${esc(spec.footer?.[0] ?? 'Nick Petrie')}</span><span class="url">${esc(spec.url ?? 'nickpetrie.co')}</span></div>`;
  const top = layout === 'issue' || spec.masthead
    ? `<div class="top"><div class="masthead">${MAST}</div>${spec.count ? `<span class="count">${esc(spec.count)}</span>` : ''}</div>`
    : `<div class="top"><div class="brand">${NP}<span>Nick Petrie</span></div>${spec.count ? `<span class="count">${esc(spec.count)}</span>` : ''}</div>`;
  let main = '';
  const kicker = spec.kicker ? `<p class="kicker">${esc(spec.kicker)}</p>` : '';
  const text = spec.text ? `<p class="text">${esc(spec.text)}</p>` : '';
  const facts = spec.facts?.length ? `<ul class="facts">${spec.facts.map((f) => `<li><b>${esc(f.label)}</b>${esc(f.value)}</li>`).join('')}</ul>` : '';
  const cta = spec.cta ? `<span class="cta">${esc(spec.cta)}</span>` : '';
  if (layout === 'quote') {
    main = `<div class="main"><div class="quote-mark">“</div><p class="quote">${rich(spec.quote)}</p>${spec.byline ? `<p class="byline">${esc(spec.byline)}${spec.source ? `<span>${esc(spec.source)}</span>` : ''}</p>` : ''}</div>`;
  } else if (layout === 'point') {
    main = `<div class="main">${spec.number != null ? `<p class="number">${esc(spec.number)}</p>` : ''}${kicker}<h1 class="headline">${rich(spec.headline)}</h1>${text}</div>`;
  } else {
    const portrait = spec.portrait ? `<img class="portrait" src="${esc(spec.portrait)}" alt="">` : '';
    main = `<div class="main${layout === 'statement' || layout === 'issue' ? ' bottom' : ''}">${portrait}${layout !== 'offer' && layout !== 'issue' && !spec.masthead ? '<div class="rules"><i></i><i></i></div>' : ''}${kicker}<h1 class="headline">${rich(spec.headline)}</h1>${text}${facts}${cta}</div>`;
  }
  el.innerHTML = top + main + foot;
  root.appendChild(el);
  return el;
}

// Keep everything inside the canvas: step the headline down to 70% before giving up.
function fit(el, spec) {
  const changed = [];
  const main = el.querySelector('.main');
  const base = Number(el.style.getPropertyValue('--hs'));
  let hs = base;
  // Height the children need (with margins) against the room the main area has.
  const over = () => {
    const kids = [...main.children];
    if (!kids.length) return 0;
    const top = Math.min(...kids.map((k) => k.getBoundingClientRect().top - parseFloat(getComputedStyle(k).marginTop)));
    const bottom = Math.max(...kids.map((k) => k.getBoundingClientRect().bottom + parseFloat(getComputedStyle(k).marginBottom)));
    return (bottom - top) - main.clientHeight;
  };
  while (over() > 1 && hs > base * 0.7) { hs = Math.round(hs - 2); el.style.setProperty('--hs', hs); }
  if (hs !== base) changed.push('headlineSize');
  const outside = over() > 1 ? [{ el: spec.layout || 'statement', over: Math.round(over() / (el.clientWidth / 1080)) }] : [];
  return { ok: outside.length === 0, changed, headlineSize: hs !== base ? hs : null, outside };
}

window.FIT = null;
window.render = async function (spec = window.SPEC, root = document.getElementById('root')) {
  window.FIT = null;
  root.innerHTML = '';
  const slides = spec.slides || [spec];
  await document.fonts.ready;
  const fits = [];
  for (const s of slides) {
    const el = await draw({ format: spec.format, ...s }, root);
    await document.fonts.ready;
    fits.push(fit(el, s));
  }
  window.FIT = { ok: fits.every((f) => f.ok), slides: fits };
  return window.FIT;
};
</script>
</body>
